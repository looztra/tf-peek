# Layered over .mise.toml with `MISE_ENV=sandbox`, by
# .claude/hooks/session-start.sh, when .mise.toml's default backends turn out
# to be unreachable.
#
# .mise.toml resolves bats/editorconfig-checker/shellcheck/shfmt/uv through
# aqua, which downloads GitHub release assets. Some sandboxes (Claude Code on
# the web among them) allow egress only to pypi.org, registry.npmjs.org and
# the Go module proxy. These aliases point the same tool names at those
# registries; the versions still come from .mise.toml, because every pin there
# resolves unchanged against the backend below:
#
#   bats                 1        -> 1.13.0   (npm)
#   editorconfig-checker 3        -> 3.11.1   (Go proxy)
#   shellcheck           0.11     -> 0.11.0.1 (PyPI; the wheel bundles the
#                                              real ShellCheck binary)
#   shfmt                3.13.1   -> 3.13.1   (Go proxy)
#   uv                   0.12.5   -> 0.12.5   (PyPI)
#
# `pipx:pre-commit` in .mise.toml already installs from PyPI, so it needs no
# alias. shfmt and editorconfig-checker need a Go toolchain on PATH; the Go
# module is the only GitHub-free source that is the *same* editorconfig-checker
# (the PyPI wrapper is an sdist that downloads from GitHub Releases, and the
# npm package is an unrelated JavaScript reimplementation). mise's own `go:`
# backend invokes `go install` with an env it rebuilds itself, so an ambient
# PATH `go` (e.g. from `mise exec go@latest --`) is not enough -- go has to be
# part of this same resolved toolset. mise's core Go backend downloads from
# https://dl.google.com/go, not GitHub, so this stays GitHub-free.
[tools]
go = "1.27.0"

[tool_alias]
bats = "npm:bats"
editorconfig-checker = "go:github.com/editorconfig-checker/editorconfig-checker/v3/cmd/editorconfig-checker"
shellcheck = "pipx:shellcheck-py"
shfmt = "go:mvdan.cc/sh/v3/cmd/shfmt"
uv = "pipx:uv"
